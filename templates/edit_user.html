<!DOCTYPE html>
<html>
<head>
<title>Edit User</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body { font-family: Arial; padding: 40px; background: #f4f6f9; }
    form { background: white; padding: 20px; max-width: 450px; margin: auto; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
    input, select { width: 100%; padding: 10px; margin: 8px 0; }
    button { padding: 10px; background: #3498db; color: white; border: none; width: 100%; }
    button:hover { background: #1f6391; }
</style>
</head>

<body>

<h2>Edit User</h2>
<form method="POST">
    <label>Name</label>
    <input type="text" name="name" value="{{ user.name }}" required>

    <label>Email</label>
    <input type="email" name="email" value="{{ user.email }}" required>

    <label>Role</label>
    <select name="role" required>
        <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Admin</option>
        <option value="doctor" {% if user.role == "doctor" %}selected{% endif %}>Doctor</option>
        <option value="patient" {% if user.role == "patient" %}selected{% endif %}>Patient</option>
    </select>

    <button type="submit">Update User</button>
</form>

</body>
</html>
