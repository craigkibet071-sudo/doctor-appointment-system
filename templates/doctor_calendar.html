<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Doctor Calendar</title>

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* calendar container */
    #doctorCalendar {
        background: #fff;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    .card-calendar { padding: 20px; border-radius: 12px; background: white; }
  </style>
</head>

<body class="bg-light">

<div class="container-fluid mt-4">
  <div class="row">

      <!-- SIDEBAR -->
      <div class="col-md-3">
        {% include "doctor_sidebar.html" %}
      </div>

      <!-- MAIN -->
      <div class="col-md-9">
        <div class="card-calendar shadow-sm">

          <h4 class="text-primary fw-bold mb-3">Doctor Calendar</h4>
          <div id="doctorCalendar"></div>

        </div>
      </div>

  </div>
</div>

<!-- FullCalendar Scripts -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    let calendarEl = document.getElementById("doctorCalendar");

    let calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        height: 650,

        eventSources: [
  {
    url: '/doctor/availability/json',
    method: 'GET',
    extraParams: { doctor_name: "{{ doctor.name }}" }  // ensure name matches DB
  }
]
    });

    calendar.render();
});
</script>

</body>
</html>
