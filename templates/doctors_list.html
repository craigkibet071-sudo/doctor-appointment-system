<!DOCTYPE html>
<html>
<head>
<title>Doctors</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.card {
  border-radius: 15px;
}
.doctor-img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 15px 15px 0 0;
}
.card-title {
  font-weight: 700;
}
.badge {
  font-size: 0.85rem;
}
</style>
</head>

<body class="bg-light">

<div class="container py-4">
  <h3 class="text-center text-success mb-4">👨‍⚕️ Our Doctors</h3>

  <div class="row">

  {% for d in doctors %}
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        <img src="{{ d.photo or '/static/images/This AI art piece features a compassionate Black.jpg' }}" class="doctor-img">

        <div class="card-body text-center">
          <h5 class="card-title">{{ d.name }}</h5>
          <span class="badge text-bg-info">{{ d.specialty }}</span><br>
          <span class="text-muted small">{{ d.department }}</span>

          <p class="mt-2">
            📞 {{ d.phone }}
          </p>

          <a href="{{ url_for('book_appointment', doctor_id=d._id) }}" class="btn btn-primary btn-sm mt-2">
  📅 Book Appointment
</a>

        </div>
      </div>
    </div>
  {% endfor %}

  </div>

  <div class="text-center">
    <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary">⬅ Back</a>
  </div>
</div>

</body>
</html>
