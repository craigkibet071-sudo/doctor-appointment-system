<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome - Healthcare System</title>

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      /* ✅ Background Image */
      background: url("/static/images/undefined (1).jpeg") no-repeat center center/cover;
      position: relative;
    }

    /* ✅ Dark Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    .content {
      z-index: 1;
      color: white;
      max-width: 500px;
    }

    h2 {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 25px;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="content container">
    <h2>Welcome to Healthcare System</h2>

    <!-- ✅ Bootstrap Buttons -->
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a class="btn btn-primary btn-lg px-4" href="{{ url_for('login') }}">Login</a>
      <a class="btn btn-success btn-lg px-4" href="{{ url_for('register') }}">Register as Patient</a>
    </div>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
