<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Availability</title>

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }
        label {
            font-weight: 500;
            margin-top: 10px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        button {
            background: green;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: darkgreen;
        }
        a {
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            color: #333;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Book Appointment with Dr. {{ doctor.name }}</h2>

    <form method="POST" action="{{ url_for('patient_book_appointment', doctor_id=doctor._id) }}">
        <label>Select Slot</label>
        <select name="slot_id" required>
            {% for slot in availability %}
                <option value="{{ slot._id }}">
                    {{ slot.date }} | {{ slot.start_time }} - {{ slot.end_time }}
                    {% if slot.notes %} ({{ slot.notes }}) {% endif %}
                </option>
            {% endfor %}
        </select>

        <label>Message (optional)</label>
        <textarea name="message" placeholder="Add a brief note..."></textarea>

        <button type="submit">Book Appointment</button>
    </form>

    <a href="{{ url_for('patient_dashboard') }}">← Back to Dashboard</a>
</div>

</body>
</html>
