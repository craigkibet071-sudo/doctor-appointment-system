<!DOCTYPE html>
<html>
<head>
<title>My Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.profile-card {
    max-width: 450px;
    margin: auto;
    margin-top: 40px;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #4CAF50;
}

.form-control {
    border-radius: 10px;
}
</style>
</head>

<body class="bg-light">

<div class="profile-card">

    <h4 class="text-center text-success mb-3">👤 My Profile</h4>

    <div class="text-center mb-3">
        <img 
        src="{{ patient.photo or '/static/images/This AI art piece features a compassionate Black.jpeg' }}" 
        class="profile-img"
        alt="Profile Photo">
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" name="name" value="{{ patient.name }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Upload Photo</label>
            <input type="file" name="photo" class="form-control">
            <small class="text-muted">PNG / JPG only</small>
        </div>

        <button type="submit" class="btn btn-success w-100">✅ Update Profile</button>
    </form>

    <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary w-100 mt-2">⬅ Back</a>

</div>

</body>
</html>
