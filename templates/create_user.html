<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create User</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.card {
  max-width: 650px;
  margin: auto;
  margin-top: 40px;
}
</style>
</head>

<body class="bg-light">

<div class="card shadow-lg p-4">
  <h3 class="text-center text-primary mb-4">➕ Create User</h3>

  <form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" name="name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" name="email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Role</label>
      <select class="form-select" name="role" id="roleSelect" required>
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <!-- Doctor Fields -->
    <div id="doctorFields" style="display: none;">
      <h5 class="text-secondary mt-3">Doctor Information</h5>

      <div class="mb-3">
        <label class="form-label">Specialty</label>
        <input type="text" class="form-control" name="specialty">
      </div>

      <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" class="form-control" name="department">
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" name="phone">
      </div>

      <div class="mb-3">
        <label class="form-label">Upload Photo</label>
        <input type="file" class="form-control" name="photo">
      </div>
    </div>

    <button class="btn btn-primary w-100 mt-3">Create User</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary w-100 mt-2">Cancel</a>

  </form>
</div>

<script>
document.getElementById("roleSelect").addEventListener("change", function () {
  document.getElementById("doctorFields").style.display =
    this.value === "doctor" ? "block" : "none";
});
</script>

</body>
</html>
