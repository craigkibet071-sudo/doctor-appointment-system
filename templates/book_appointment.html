<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment | Digital Healthcare</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eaf4fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}
        .appointment-container { width: 420px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);}
        h2 { text-align: center; color: #333; }
        form { display: flex; flex-direction: column; }
        input, select { margin-top: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        label { font-size: 14px; margin-top: 10px; }
        button { margin-top: 18px; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #0056b3; }
        .slot-btn { margin-top: 15px; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; text-align: center; }
        .slot-btn:hover { background: #1e7e34; }
        a { color: #007bff; text-decoration: none; }
        p { text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="appointment-container">
    <h2>Book Appointment</h2>

    <form method="POST" action="{{ url_for('patient_book_slot') }}">

        <!-- Doctor selection -->
        <label for="doctor_name">Doctor's Name</label>
        <input list="doctors" name="doctor_name" placeholder="Type or select doctor" required>
        <datalist id="doctors">
            {% for doc in doctors %}
                <option value="{{ doc.name }}">
            {% endfor %}
        </datalist>

        <!-- Date -->
        <label for="date">Select Date</label>
        <input type="date" name="date" required>

        <!-- Time -->
        <label for="time">Select Time</label>
        <input type="time" name="time" required>

        <!-- View Doctor Availability -->
        <button type="button" class="slot-btn" onclick="goToSlots()">View Doctor Availability</button>

        <!-- Submit -->
        <button type="submit">Book Appointment</button>

    </form>

    <p><a href="{{ url_for('patient_dashboard') }}">← Back to Dashboard</a></p>
</div>

<script>
function goToSlots() {
    let doctorName = document.querySelector("input[name='doctor_name']").value;
    if (!doctorName) {
        alert("Please select a doctor first.");
        return;
    }

    // ✅ Correct route for viewing availability
    window.location.href = "/patient/doctor/" + encodeURIComponent(doctorName) + "/availability";
}
</script>
</body>
</html>
