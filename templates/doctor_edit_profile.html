{% extends "base.html" %}
{% block content %}
<div class="container-fluid mt-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
      {% include "doctor_sidebar.html" %}
    </div>

    <!-- Main content -->
    <div class="col-md-9">
      <div class="card shadow-sm p-4">
        <h4 class="mb-3 text-primary">Edit Profile</h4>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ doctor.name }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" value="{{ doctor.email }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" value="{{ doctor.phone }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Specialty</label>
            <input type="text" name="specialty" class="form-control" value="{{ doctor.specialty }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Password (Leave blank to keep current)</label>
            <input type="password" name="password" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Profile Photo</label><br>
            <img src="{{ doctor.photo or '/static/images/doctor_default.jpg' }}" alt="Doctor Photo" class="rounded mb-2" width="100">
            <input type="file" name="photo" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
