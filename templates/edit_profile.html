<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile | Digital Healthcare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #eaf4fc;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .edit-container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            width: 420px;
        }
        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }
        label {
            margin-top: 10px;
            font-weight: 500;
        }
        input {
            margin-top: 5px;
            padding: 10px;
        }
        button {
            margin-top: 20px;
            width: 100%;
        }
        .photo-preview {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .photo-preview img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
<div class="edit-container">
    <h2>Edit Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="photo-preview">
            <img src="{{ patient.photo or '/static/images/patient_default.jpeg' }}" alt="Profile Photo">
        </div>

        <label for="name">Full Name</label>
        <input type="text" name="name" class="form-control" value="{{ patient.name }}" required>

        <label for="email">Email</label>
        <input type="email" name="email" class="form-control" value="{{ patient.email }}" required>

        <label for="phone">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ patient.phone }}" required>

        <label for="password">New Password (optional)</label>
        <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">

        <label for="photo">Profile Photo (optional)</label>
        <input type="file" name="photo" class="form-control">

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary mt-2 w-100">Cancel</a>
    </form>
</div>
</body>
</html>
