<!DOCTYPE html>
<html>
<head>
<title>My Appointments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background: #f8f9fa;
    font-family: "Segoe UI", sans-serif;
  }

  .container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    margin-top: 40px;
  }

  h3 {
    font-weight: 700;
    color: #198754;
  }

  table {
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: #198754 !important;
    color: white;
    text-align: center;
  }

  td {
    vertical-align: middle;
    text-align: center;
  }

  .status-badge {
    padding: 6px 12px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 600;
  }

  .approved {
    background: #d4edda;
    color: #155724;
  }

  .rejected {
    background: #f8d7da;
    color: #721c24;
  }

  .pending {
    background: #fff3cd;
    color: #856404;
  }

  .btn-secondary {
    border-radius: 25px;
    padding: 8px 20px;
  }
</style>
</head>
<body>

<div class="container">
  <h3 class="mb-4">My Appointments</h3>

  <table class="table table-bordered">
    <tr>
      <th>Doctor</th>
      <th>Date</th>
      <th>Time</th>
      <th>Status</th>
    </tr>

    {% for a in appointments %}
    <tr>
      <td>{{ a.doctor_name }}</td>
      <td>{{ a.date }}</td>
      <td>{{ a.time }}</td>
      <td>
        {% if a.status == "Approved" %}
          <span class="status-badge approved">✅ Approved</span>
        {% elif a.status == "Rejected" %}
          <span class="status-badge rejected">❌ Rejected</span>
        {% else %}
          <span class="status-badge pending">🕒 Pending</span>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>

  <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary">⬅ Back</a>
</div>

</body>
</html>
