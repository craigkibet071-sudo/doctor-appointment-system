<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login - Healthcare System</title>

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("/static/images/undefined (1).jpeg") no-repeat center center/cover;
      position: relative;
    }

    .overlay {
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    .login-box {
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.92);
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      backdrop-filter: blur(8px);
    }

    .login-box h3 {
      font-weight: 700;
      margin-bottom: 25px;
      color: #007bff;
    }

    .form-control {
      border-radius: 6px;
      padding: 12px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
    }

    a.register-link {
      text-decoration: none;
      font-weight: 500;
    }
  </style>

</head>

<body>
  <div class="overlay"></div>

  <form method="POST" class="login-box">
    <h3 class="text-center">User Login</h3>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-danger text-center">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <div class="mb-3">
      <label>Email</label>
      <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-login">Login</button>

    <div class="text-center mt-3">
      <small>Don't have an account?
        <a href="{{ url_for('register') }}" class="register-link text-success">Register here</a>
      </small>
    </div>
  </form>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
